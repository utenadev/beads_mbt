name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@v4
      with:
        path: '.'

    - name: Setup MoonBit
      uses: hustcer/setup-moonbit@v1
      with:
        version: latest

    - name: Setup just
      uses: extractions/setup-just@v2

    - name: Update MoonBit registry
      run: moon update

    - name: Run local CI checks (fmt, info, check, test)
      run: |
        just fmt-check
        moon info
        echo "=== generated mbti status ==="
        git status --porcelain -- ':(glob)**/*.generated.mbti'
        echo "=== generated mbti diff ==="
        git diff -- ':(glob)**/*.generated.mbti'
        echo "=== end diff ==="
        just check
        just test

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    
    steps:
    - uses: actions/checkout@v4
      with:
        path: '.'
    
    - name: Debug - List files
      run: pwd && ls -la
    
    - name: Setup MoonBit
      uses: hustcer/setup-moonbit@v1
      with:
        version: latest
    
    - name: Update MoonBit registry
      run: moon update
    
    - name: Verify MoonBit installation
      run: moon version --all
    
    - name: Build native binary
      run: moon build cmd/bm --target native
    
    - name: Run E2E tests
      run: bash scripts/e2e_test.sh
    
    - name: Stage binary as bm
      run: cp _build/native/debug/build/cmd/bm/bm.exe bm

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: beads-mbt-linux
        path: bm
        if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: .
    
    steps:
    - uses: actions/checkout@v4
      with:
        path: '.'
    
    - name: Setup MoonBit
      uses: hustcer/setup-moonbit@v1
      with:
        version: latest
    
    - name: Update MoonBit registry
      run: moon update
    
    - name: Build native binary
      run: moon build cmd/bm --target native
    
    - name: Stage binary as bm
      run: cp _build/native/debug/build/cmd/bm/bm.exe bm

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: beads-mbt-macos
        path: bm
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    
    steps:
    - uses: actions/checkout@v4
      with:
        path: '.'
    
    - name: Setup MoonBit
      uses: hustcer/setup-moonbit@v1
      with:
        version: latest
    
    - name: Update MoonBit registry
      run: moon update
    
    - name: Build native binary
      run: moon build cmd/bm --target native
    
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: beads-mbt-windows
        # Windows keeps the `.exe` suffix
        path: _build/native/debug/build/cmd/bm/bm.exe
        if-no-files-found: error
